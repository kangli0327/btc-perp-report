name: Deploy OKX account worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Install Wrangler for secret upload
        run: npm install --global wrangler@3.90.0

      - name: Upload OKX worker secrets
        shell: bash
        run: |
          printf '%s' "$OKX_API_KEY" | wrangler secret put OKX_API_KEY
          printf '%s' "$OKX_API_SECRET" | wrangler secret put OKX_API_SECRET
          printf '%s' "$OKX_API_PASSPHRASE" | wrangler secret put OKX_API_PASSPHRASE
          if [ -n "$TRADING_ECONOMICS_KEY" ]; then
            printf '%s' "$TRADING_ECONOMICS_KEY" | wrangler secret put TRADING_ECONOMICS_KEY
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          TRADING_ECONOMICS_KEY: ${{ secrets.TRADING_ECONOMICS_KEY }}
