name: Run AI simulation account

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-sim-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Advance simulation account
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 12 --retry-all-errors --max-time 120 \
            --output /tmp/sim.json \
            "https://btc-account.kangli0327-btc.workers.dev/sim?trigger=github-cron&ts=$(date +%s)"
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/sim.json").read_text())
          if not payload.get("ok"):
              raise SystemExit(payload.get("error", "simulation worker returned ok=false"))
          print(
              "sim ok:",
              payload.get("decision"),
              payload.get("decisionReason", "")[:120],
              "mode=", payload.get("riskRules", {}).get("mode"),
          )
          PY
